apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ui.serviceName }}
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  {{- with .Values.ui.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "detectflow.selectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "detectflow.labels" (dict "ctx" . "component" "ui") | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.ui.podAnnotations (not .Values.ui.existingConfigMap) (and (not .Values.ui.existingSecret) .Values.ui.secret) }}
      annotations:
        {{- if not .Values.ui.existingConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/ui/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and (not .Values.ui.existingSecret) .Values.ui.secret }}
        checksum/secret: {{ include (print $.Template.BasePath "/ui/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.ui.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds }}
      {{- include "detectflow.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin-panel-ui
          image: {{ include "detectflow.image" .Values.ui.image | quote }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4173
          envFrom:
            - configMapRef:
                name: {{ .Values.ui.existingConfigMap | default "admin-panel-ui-config" }}
            {{- if or .Values.ui.existingSecret .Values.ui.secret }}
            - secretRef:
                name: {{ .Values.ui.existingSecret | default "admin-panel-ui-secret" }}
            {{- end }}
            {{- with .Values.ui.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ui.extraEnvs }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- with .Values.ui.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.ui.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
