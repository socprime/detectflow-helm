{{- if not .Values.ui.existingSecret }}
{{- if .Values.ui.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: admin-panel-ui-secret
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "ui") | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.ui.secret | nindent 2 }}
{{- end }}
{{- end }}
