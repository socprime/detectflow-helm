{{- if .Values.networkPolicy.enabled }}
---
# UI: ingress to the Vite preview port. allowAll=true keeps it open for
# out-of-namespace sources (ALB target-type=ip, ingress controllers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.ui.serviceName }}
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "detectflow.selectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {{- if not .Values.networkPolicy.ui.allowAll }}
      from:
        {{- with .Values.networkPolicy.ui.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      ports:
        # Named container port: NetworkPolicy matches the POD port (targetPort),
        # not the Service port - the name always resolves to the real containerPort.
        - port: http
---
# Backend: by default reachable only from the UI pods (the /api/v1 proxy).
# Automatically opens to all sources (same as allowAll: true) when
# ingress.backend.enabled=true, since the ingress controller lives outside
# this namespace and can't be scoped by podSelector. extraFrom only has an
# effect while both allowAll and ingress.backend.enabled are false.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.backend.serviceName }}
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "detectflow.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {{- if not (or .Values.networkPolicy.backend.allowAll .Values.ingress.backend.enabled) }}
      from:
        - podSelector:
            matchLabels:
              {{- include "detectflow.selectorLabels" (dict "ctx" . "component" "ui") | nindent 14 }}
        {{- with .Values.networkPolicy.backend.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      ports:
        # Named container port - same reasoning as the UI policy above.
        - port: http
{{- end }}
