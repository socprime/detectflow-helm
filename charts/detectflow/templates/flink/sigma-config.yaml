{{- if not .Values.flink.existingSecret }}
{{- if not .Values.flink.secret }}
{{- fail "flink: set flink.existingSecret or fill flink.secret (KAFKA_BOOTSTRAP_SERVERS, KAFKA_AUTH_METHOD) - an empty flink-sigma-config Secret breaks Flink jobs at runtime" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: flink-sigma-config
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "flink") | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.flink.secret | nindent 2 }}
{{- end }}
