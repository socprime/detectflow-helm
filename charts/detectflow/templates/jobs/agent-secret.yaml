{{- if not .Values.jobs.agent.existingSecret }}
{{- if .Values.jobs.agent.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: detectflow-agent-secrets
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "flink") | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.jobs.agent.secret | nindent 2 }}
{{- end }}
{{- end }}
