{{- if not .Values.backend.existingSecret }}
{{- if not .Values.backend.secret }}
{{- fail "backend: set backend.existingSecret or fill backend.secret (DATABASE_URL, KAFKA_BOOTSTRAP_SERVERS, KAFKA_AUTH_METHOD, JWT_SECRET_KEY, JWT_REFRESH_SECRET_KEY) - an empty backend Secret breaks the app at runtime" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: admin-panel-be-secret
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.backend.secret | nindent 2 }}
{{- end }}
