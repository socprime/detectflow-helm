{{- if .Values.backend.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backend.serviceAccount.name | default .Values.backend.serviceName }}
  labels:
    {{- include "detectflow.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "detectflow.imagePullSecrets" . | nindent 0 }}
{{- end }}
