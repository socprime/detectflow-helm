    {{- if .Values.ingress.backend.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.backend.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.backend.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.backend.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.backend.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.backend.host | quote }}
      secretName: {{ printf "%s-backend-tls" (include "detectflow.fullname" .) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.backend.host | quote }}
      http:
        paths:
          - path: /
            pathType: {{ .Values.ingress.backend.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.backend.serviceName | quote }}
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
